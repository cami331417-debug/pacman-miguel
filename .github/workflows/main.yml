name: Compilar APK Pacman

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev ffmpeg lld
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer

    - name: Build APK with Buildozer
      run: |
        buildozer init
        python3 -c "
        with open('buildozer.spec', 'r') as f: config = f.read()
        import re
        config = re.sub(r'^title = .*', 'title = PACMAN DE MIGUEL', config, flags=re.M)
        config = re.sub(r'^package.name = .*', 'package.name = pacmandemiguel', config, flags=re.M)
        config = re.sub(r'^source.include_exts = .*', 'source.include_exts = py,png,jpg,mp3,wav', config, flags=re.M)
        config = re.sub(r'^#icon.filename = .*', 'icon.filename = %(source.dir)s/icon.png', config, flags=re.M)
        config = re.sub(r'^requirements = .*', 'requirements = python3,pygame', config, flags=re.M)
        config = re.sub(r'^orientation = .*', 'orientation = landscape', config, flags=re.M)
        config = re.sub(r'^# android.accept_sdk_license = .*', 'android.accept_sdk_license = True', config, flags=re.M)
        config = re.sub(r'^# android.api = .*', 'android.api = 33', config, flags=re.M)
        config = re.sub(r'^# android.minapi = .*', 'android.minapi = 21', config, flags=re.M)
        with open('buildozer.spec', 'w') as f: f.write(config)
        "
        # Forzar aceptación de licencias de Android SDK de forma automática
        yes | buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Pacman-APK
        path: bin/*.apk
